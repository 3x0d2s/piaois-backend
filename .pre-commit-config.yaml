repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: check-yaml
        name: check YAML
        entry: uv run --locked check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: check TOML
        entry: uv run --locked check-toml
        language: system
        types: [toml]
      - id: check-merge-conflict
        name: check merge conflicts
        entry: uv run --locked check-merge-conflict
        language: system
        types: [text]
      - id: check-added-large-files
        name: check added large files
        entry: uv run --locked check-added-large-files --maxkb=1024
        language: system
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --locked end-of-file-fixer
        language: system
        types: [text]
      - id: ty
        name: ty check
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true
