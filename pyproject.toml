[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django-modern-rest[jwt,msgspec,openapi]>=0.17.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "pre-commit>=4.7.0",
    "pre-commit-hooks>=6.0.0",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]

[tool.ty.environment]
python = "./.venv"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
